<!-- TagFilter: dropdown panel rendered inside .tag-filter container -->
<div class="tag-filter__dropdown" id="tag-filter-panel">
  <button class="tag-filter__clear-btn" id="tag-filter-clear" style="display:none">
    Clear filter
  </button>
  <ul class="tag-filter__list" id="tag-filter-list" role="listbox" aria-multiselectable="true">
    <!-- tag options injected dynamically -->
  </ul>
  <p class="tag-filter__empty" id="tag-filter-empty" style="display:none">No tags yet</p>
</div>
