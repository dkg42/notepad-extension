<!-- Format picker panel — injected into the extension's shadow DOM on "Export chat" click -->
<div class="format-picker" id="format-picker-panel">
  <p class="picker-title">Export as</p>
  <div class="format-options" id="format-options-list">
    <!-- Format radio options injected dynamically by format-picker.ts -->
  </div>
  <div class="picker-actions">
    <button class="picker-btn-cancel" id="format-picker-cancel">Cancel</button>
    <button class="picker-btn-export" id="format-picker-confirm">Export</button>
  </div>
</div>
